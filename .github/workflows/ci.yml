name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solver: [z3, cvc5]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lit OutputCheck
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        if [ "${{ matrix.solver }}" = "z3" ]; then
          sudo apt-get install -y z3
        else
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH_NAME="x86_64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH_NAME="arm64"
          else
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi
          wget https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.1/cvc5-Linux-${ARCH_NAME}-static.zip
          unzip cvc5-Linux-${ARCH_NAME}-static.zip
          chmod +x cvc5-Linux-${ARCH_NAME}-static/bin/cvc5
          echo "$GITHUB_WORKSPACE/cvc5-Linux-${ARCH_NAME}-static/bin/" >> $GITHUB_PATH
        fi
    
    - name: "Install Dafny"
      uses: dafny-lang/setup-dafny-action@v1
      with:
        dafny-version: "4.11.0"
    
    - name: Build
      run: make build
    
    - name: Run tests
      run: make lit