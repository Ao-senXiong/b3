name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solver: [z3, cvc5]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lit==18.1.8 OutputCheck
    
    - name: Install solvers
      run: |
        sudo apt-get update
        if [ "${{ matrix.solver }}" = "z3" ]; then
          sudo apt-get install -y z3
        else
          sudo apt-get install -y cvc5
        fi
    
    - name: "Install Dafny"
      uses: dafny-lang/setup-dafny-action@v1
    
    - name: Build
      run: make build
    
    - name: Verify
      run: make verify
    
    - name: Run tests
      run: make lit